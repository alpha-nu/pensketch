<!DOCTYPE html>
<!--
  pensketch - a CI pipeline, drawn from data.

  Nothing here is a picture of a pipeline. It is the pipeline's shape as a
  plain object: groups for the two stages, a diamond for the gate, and one
  dotted edge for the path back to the start. Change a job name and the diff
  is one line.

  Two things have to happen before this page shows anything:

    1. Build the packages. From the repository root:

         npm run build

       The page imports packages/core/dist/index.js, which is what the build
       produces.

    2. Serve the repository over HTTP. Also from the repository root:

         npx serve .              -> http://localhost:3000/examples/vanilla/
         python3 -m http.server   -> http://localhost:8000/examples/vanilla/

  Double-clicking the file will not work. A file:// document has the opaque
  origin "null", ES module scripts are fetched with CORS, and an opaque origin
  fails that check - the module never loads and the page stays blank.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pensketch - a CI pipeline</title>
<style>
/* Page chrome. The theming below this block is the documented snippet. */
:root { color-scheme: light dark; }
body { margin: 0; padding: 24px; }
svg { display: block; width: 100%; height: auto; }
</style>
<style>
:root {
  --ps-ink: #232B36;
  --ps-pen: #2B5B8A;
  --ps-accent: #B3402E;
  --ps-muted: #5A6572;
  --ps-wash: rgba(43, 91, 138, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ps-ink: #D9DFE7;
    --ps-pen: #7FA9DB;
    --ps-accent: #DB8570;
    --ps-muted: #93A0AD;
    --ps-wash: rgba(127, 169, 219, .07);
  }
}
/* the hand-drawn feel depends on a handwriting font for labels */
svg text {
  font-family: "Chalkboard SE", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
}
</style>
</head>
<body>
<svg id="pipeline" viewBox="0 0 880 340" role="img" aria-label="A continuous integration pipeline"></svg>
<script type="module">
  import { draw } from '../../packages/core/dist/index.js'; // a bare specifier needs a bundler, and this page has none

  draw(document.getElementById('pipeline'), {
    nodes: [
      // Groups are drawn first and sit behind everything, so they read as
      // stages rather than as boxes around boxes.
      { id: 'ci',      shape: 'group',   x: 30,  y: 30,  w: 470, h: 230, lines: ['continuous integration'] },
      { id: 'rel',     shape: 'group',   x: 530, y: 30,  w: 320, h: 230, lines: ['release'] },

      { id: 'push',    shape: 'pill',    x: 55,  y: 120, w: 110, h: 48, lines: ['push'] },
      { id: 'lint',    shape: 'box',     x: 195, y: 55,  w: 120, h: 44, lines: ['lint'] },
      { id: 'test',    shape: 'box',     x: 195, y: 122, w: 120, h: 44, lines: ['test'] },
      { id: 'build',   shape: 'box',     x: 195, y: 189, w: 120, h: 44, lines: ['build'] },
      { id: 'gate',    shape: 'diamond', x: 355, y: 106, w: 120, h: 76, lines: ['all green?'], size: 12 },
      { id: 'staging', shape: 'box',     x: 570, y: 75,  w: 150, h: 48, lines: ['deploy staging'], size: 12 },
      { id: 'prod',    shape: 'box',     x: 570, y: 180, w: 150, h: 48, lines: ['deploy prod'], accent: true },
    ],
    edges: [
      // Three jobs from one push, then three results into one gate. Fanning
      // out and back in is just six edges naming the same two anchors.
      { from: ['push', 'r'],    to: ['lint', 'l'] },
      { from: ['push', 'r'],    to: ['test', 'l'] },
      { from: ['push', 'r'],    to: ['build', 'l'] },
      { from: ['lint', 'r'],    to: ['gate', 'l'] },
      { from: ['test', 'r'],    to: ['gate', 'l'] },
      { from: ['build', 'r'],   to: ['gate', 'l'] },

      { from: ['gate', 'r'],    to: ['staging', 'l'], label: 'green', lx: 500, ly: 100 },
      { from: ['staging', 'b'], to: ['prod', 't'],    label: 'smoke passed', lx: 652, ly: 156, anchor: 'start' },

      // The way back. `via` walks the legs exactly as given - under both
      // groups, then up into the pill it started from.
      { from: ['gate', 'b'],    to: ['push', 'b'], via: [[415, 300], [110, 300]],
        dotted: true, label: 'any job red', lx: 262, ly: 286 },
    ],
    notes: [
      { x: 850, y: 292, lines: ['prod only from a tag'], anchor: 'end',
        arrowFrom: [770, 283], arrowTo: [700, 238] },
    ],
  }, { seed: 7 });
</script>
</body>
</html>
