<!DOCTYPE html>
<!--
  pensketch - pensketch's own architecture, drawn by pensketch.

  A logical architecture in the usual notation: layers as groups, components
  as boxes, dependencies as arrows - four published packages, one of which
  carries four entry points. What makes it the showcase is that it reaches for
  nearly the whole data model in one picture - all three drawn shapes, `accent`
  and `hatch`, straight connectors, orthogonal ones, a self-transition, both
  kinds of brace, and note pointers that bow and take corners - without once
  reaching for `raw`.

  That last part is the point. `raw` is the escape hatch for what the data
  model has no word for, and this diagram needed no escape: it is plain data
  end to end, which is why it can be served to an agent as
  `pensketch://example/showcase` exactly as it is drawn here.

  Two things have to happen before this page shows anything:

    1. Build the packages. From the repository root:

         npm run build

       The page imports packages/core/dist/index.js, which is what the build
       produces.

    2. Serve the repository over HTTP. Also from the repository root:

         npx serve .              -> http://localhost:3000/examples/showcase/
         python3 -m http.server   -> http://localhost:8000/examples/showcase/

  Double-clicking the file will not work. A file:// document has the opaque
  origin "null", ES module scripts are fetched with CORS, and an opaque origin
  fails that check - the module never loads and the page stays blank.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pensketch - the architecture of pensketch</title>
<style>
/* Page chrome. The theming below this block is the documented snippet. */
:root { color-scheme: light dark; }
body { margin: 0; padding: 24px; }
svg { display: block; width: 100%; height: auto; }
</style>
<style>
:root {
  --ps-ink: #232B36;
  --ps-pen: #2B5B8A;
  --ps-accent: #B3402E;
  --ps-muted: #5A6572;
  --ps-wash: rgba(43, 91, 138, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ps-ink: #D9DFE7;
    --ps-pen: #7FA9DB;
    --ps-accent: #DB8570;
    --ps-muted: #93A0AD;
    --ps-wash: rgba(127, 169, 219, .07);
  }
}
/* the hand-drawn feel depends on a handwriting font for labels */
svg text {
  font-family: "Chalkboard SE", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
}
</style>
</head>
<body>
<svg id="showcase" viewBox="0 0 1340 800" role="img"
     aria-label="The architecture of pensketch: what draws a diagram and what makes it draw itself, core's four entry points, the renderer and the checker"></svg>
<script type="module">
  import { draw } from '../../packages/core/dist/index.js'; // a bare specifier needs a bundler, and this page has none

  // The notation, stated once so the picture does not have to be guessed at:
  //
  //   group    a layer
  //   box      a module
  //   pill     something outside the package, or a value rather than a module
  //   diamond  a decision - the only one here is the checker's rules
  //   accent   where a drawing starts
  //   hatch    runs with no DOM anywhere in it
  //   dotted   a relationship no code crosses
  //
  // None of that is renderer behaviour. `hatch` and `dotted` mean whatever the
  // diagram using them says they mean, and this one says so out loud.
  draw(document.getElementById('showcase'), {
    nodes: [
      // Groups first, because that is the phase order, and the z-order: they
      // are drawn behind everything and read as bands rather than as boxes
      // around boxes. Their titles need about 30px of clear space at the top,
      // which is why every row of nodes starts 52px into its band.
      { id: 'g1',     shape: 'group',   x: 40,  y: 40,  w: 1050, h: 130, lines: ['what draws a diagram, and what makes it draw itself'] },
      { id: 'g2',     shape: 'group',   x: 40,  y: 220, w: 1050, h: 126, lines: ['core — one package, four entries'] },
      { id: 'g3',     shape: 'group',   x: 40,  y: 400, w: 790,  h: 280, lines: ['the renderer'] },
      { id: 'g4',     shape: 'group',   x: 880, y: 400, w: 230,  h: 280, lines: ['the checker'] },

      // Three ways in, and a fourth package that is not one: animation adds a
      // stylesheet to what `draw` already left behind, so it stands beside
      // them rather than under them - and nothing in the band below it is
      // drawn on. The page is a pill because it is not part of the package -
      // it is whatever HTML you already have.
      { id: 'page',   shape: 'pill',    x: 70,  y: 92,  w: 220, h: 46, lines: ['a page', 'and its <svg>'] },
      { id: 'react',  shape: 'box',     x: 330, y: 92,  w: 220, h: 46, lines: ['@pensketch/react', 'PenSketch · useSketch'] },
      { id: 'mcp',    shape: 'box',     x: 590, y: 92,  w: 220, h: 46, lines: ['@pensketch/mcp', 'three tools'] },
      { id: 'anim',   shape: 'box',     x: 870, y: 92,  w: 200, h: 46, lines: ['@pensketch/animation', 'one stylesheet'] },

      // One package, four entry points, each with its own byte budget. A
      // consumer who never imports the checker ships none of it.
      { id: 'root',   shape: 'box',     x: 70,  y: 272, w: 220, h: 46, lines: ['core', 'draw · pen · anchor'] },
      { id: 'check',  shape: 'box',     x: 330, y: 272, w: 220, h: 46, lines: ['core/check', 'check()'] },
      { id: 'server', shape: 'box',     x: 590, y: 272, w: 220, h: 46, lines: ['core/server', 'renderToString()'] },
      { id: 'schema', shape: 'box',     x: 850, y: 272, w: 220, h: 46, lines: ['core/schema.json', 'generated'] },

      // The renderer. `draw` is accented because it is where a drawing starts.
      { id: 'draw',   shape: 'box',     x: 70,  y: 452, w: 220, h: 46, lines: ['draw', 'six phases in order'], accent: true },
      { id: 'pen',    shape: 'box',     x: 330, y: 452, w: 220, h: 46, lines: ['pen', 'ten primitives'] },
      { id: 'markup', shape: 'box',     x: 590, y: 452, w: 220, h: 46, lines: ['markup, a DOM shim'], hatch: true },
      { id: 'sample', shape: 'box',     x: 70,  y: 556, w: 220, h: 46, lines: ['sample', 'curves as points'] },
      { id: 'rng',    shape: 'pill',    x: 330, y: 556, w: 220, h: 46, lines: ['rng', 'one seeded sequence'] },
      { id: 'theme',  shape: 'box',     x: 590, y: 556, w: 220, h: 46, lines: ['theme', 'CSS variables'] },

      // The checker. Hatched on a diamond and on a box in the same picture,
      // which is the shape of the feature: shading follows the outline it is
      // drawn inside, so a diamond keeps its corners bare.
      { id: 'rules',  shape: 'diamond', x: 900, y: 440, w: 190, h: 76, lines: ['nine rules'], hatch: true },
      { id: 'geom',   shape: 'box',     x: 900, y: 556, w: 190, h: 46, lines: ['geometry'] },
    ],
    edges: [
      // Orthogonal routing is corners you supply, not a mode - which means the
      // anchors are yours too, and that is what keeps these five apart. Two
      // arrows sharing a run of one line are one line in the picture and two in
      // the data, and no rule reports it: `edge-overlap` asks that *every*
      // point of each path lie near the other, which a pair that shares a
      // trunk and then diverges never satisfies. So it is placed rather than
      // checked. `mcp` reaches four things and leaves by three sides; `react`
      // arrives at core's left rather than descending the column `page`
      // already occupies. Measured: the only length any two of them share is
      // the 20px fork out of mcp's right side, and that one is drawn on
      // purpose - see below.
      //
      // `hop` on the first: `react` crosses `page`'s drop at (180, 196), and
      // the straight line is the one that stays whole.
      { from: ['page', 'b'],  to: ['root', 't'], hop: true },
      { from: ['react', 'b'], to: ['root', 'l'],   via: [[440, 196], [26, 196], [26, 295]] },
      { from: ['mcp', 'l'],   to: ['check', 't'],  via: [[570, 115], [570, 210], [440, 210]] },
      { from: ['mcp', 'b'],   to: ['server', 't'] },
      { from: ['mcp', 'r'],   to: ['schema', 't'], via: [[830, 115], [830, 200], [960, 200]],
        dotted: true, label: 'reads the schema', lx: 880, ly: 182, anchor: 'start' },

      // A dependency that runs sideways rather than down, because the package
      // it reaches is a sibling rather than something underneath:
      // `render_diagram` takes an `animate` option, and the tool imports the
      // package to serve it.
      //
      // It forks off the schema arrow rather than leaving by mcp's own free
      // side. A top anchor was drawn first and was worse: mcp's bottom anchor
      // already drops straight down at x=700, so a stub leaving the top at the
      // same x read as one line run through the box. Twenty px of shared fork
      // is the idiom this repository already uses for a decision, and
      // `edge-overlap` reports the pair at 24 against a threshold of 40.
      //
      // React reaches the same package and no arrow says so, because there is
      // nothing to draw: `PenSketch` takes `animate` as a function, and the
      // react package never names it. Nothing descends from `anim` for the
      // same kind of reason - it imports nothing, core included.
      { from: ['mcp', 'r'],   to: ['anim', 'l'] },

      { from: ['root', 'b'],   to: ['draw', 't'] },
      { from: ['check', 'b'],  to: ['rules', 't'], via: [[440, 372], [995, 372]] },
      // The one place two connectors genuinely cross, at (700, 372), in the
      // open between two groups. `hop` says this one goes over, so the run
      // beneath it is broken rather than drawn through - which is the only way
      // a reader can tell which of the two lines is continuous. Stated on the
      // edge rather than as a draw option, because an option is not part of
      // the diagram and would not reach an agent reading this as data.
      { from: ['server', 'b'], to: ['markup', 't'], hop: true },

      { from: ['draw', 'r'], to: ['pen', 'l'] },
      // The pen reaches for three things, so the three arrows are one fan:
      // same anchor, same drop, and the same kind of line. The last of them
      // aimed at `theme`'s *left* clipped the corner of the box between them
      // by a pixel and a half - no rule compares an edge with a node's
      // outline, so only a render says so - and the first fix for that was a
      // bow. A bow among two straight lines is three styles for one
      // relationship. Aiming at the top anchor instead misses the corner
      // outright and leaves the fan symmetric: -260, 0, +260 across, 58 down.
      { from: ['pen', 'b'],  to: ['sample', 't'] },
      { from: ['pen', 'b'],  to: ['rng', 't'] },
      { from: ['pen', 'b'],  to: ['theme', 't'] },

      // A self-transition: the same node and the same side named twice. The
      // defaults are sized for a 46px side; this hangs off a 220px one, so
      // `out` and `span` move together and keep the ratio that reads as a loop.
      { from: ['rng', 'b'], to: ['rng', 'b'], out: 52, span: 70,
        label: 'every call advances the sequence', lx: 440, ly: 700, anchor: 'middle' },

      { from: ['rules', 'b'], to: ['geom', 't'] },
      // The one edge that is the architecture rather than a dependency: the
      // checker measures the same curves the pen draws, from the same points,
      // which is why `sample` sits below both. Routed down the 50px gutter
      // between the two groups and under them, because straight it would cross
      // four boxes.
      { from: ['rules', 'l'], to: ['sample', 'b'], via: [[855, 478], [855, 740], [180, 740]],
        label: 'measures what the pen draws', lx: 200, ly: 762, anchor: 'start' },
    ],
    braces: [
      // Curly, and vertical, which is what lets it be curly: a brace turns its
      // corners at one fixed radius and its tip at another, so a wide one is an
      // underline with a bump. 260px down the side of two groups is in range.
      { from: [1150, 410], to: [1150, 670], depth: -26,
        lines: ['no layout,', 'no routing,', 'no text measured'], lx: 1186, ly: 540 },
      // Square, and short. A bracket is four points with no curve in it, so
      // its length is free - this one only has to span one row of boxes.
      { from: [1130, 226], to: [1130, 340], depth: -18, kind: 'square',
        lines: ['one package,', 'four entries'], lx: 1166, ly: 283 },
    ],
    notes: [
      // This note reaches `schema` from the corner, because the row it used to
      // sit in is a package now. A pointer takes corners the way an edge does,
      // and this one has to: it must pass the right edge of both bands, and
      // the only clear water is the 50px gutter between them. Routed down the
      // margin and along y=190 it crosses that edge 20px below one group's
      // corner and 30 above the other's - arithmetic, which an arc through the
      // same gap is not. A bow of 16 was drawn first and measured at 1.3px
      // from the lower corner: the perpendicular a bow displaces along also
      // moves the point where the curve crosses, so the two compound and the
      // arc left the gutter the chord sat in the middle of. Swept, the family
      // is worse than it looks - every negative bow clears the lower corner by
      // under 10px, and the positive half that does clear both (+10 is 17.5
      // and 23.7) bows the arrow away from the box it points at.
      //
      // 190 rather than the middle of the gutter, because the schema arrow
      // already runs a dotted horizontal at y=200. Five px apart the two read
      // as one line broken in the middle - no rule compares a note's pointer
      // with an edge, so only a render says so.
      { x: 1120, y: 86, anchor: 'start',
        lines: ['a diagram is plain data —', 'the schema is generated', 'from the types core ships'],
        arrowFrom: [1210, 122], via: [[1210, 190], [1040, 190]], arrowTo: [1040, 266] },
      // The bow lives here instead, where an 80px pointer - 68 of them inside
      // the checker, the rest below its border - swings into an empty corner
      // of the group. Measured at 14: 10px off `geom`, 127 off the nearest
      // brace. Positive is to the right of travel and this one travels upward,
      // so the arc swings out to the right - which is what a hand reaching for
      // something looks like.
      { x: 880, y: 706, anchor: 'start',
        lines: ['hatched — no DOM in here'],
        arrowFrom: [1010, 692], arrowTo: [1010, 612], bow: 14 },
    ],
  }, { seed: 7 });
</script>
</body>
</html>
