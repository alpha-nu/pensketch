<!DOCTYPE html>
<!--
  pensketch - a state machine that branches, and one loop it cannot say.

  An ATM is the shape most state machines are: a spine of states, one decision
  that splits the flow, and an exception path that goes back the way it came.
  Everything here is data - the diamond, the dotted retry routed down the left
  margin, the two pill terminals - except the keypad loop.

  A pensketch edge joins two *different* nodes. "Another digit, stay in
  awaiting PIN" cannot be said in the data model, by design, so it is drawn
  with `raw`: a callback handed the same pen mid-sequence, so the arc wobbles
  like the rest of the picture rather than looking pasted on.

  That has a consequence worth knowing. `raw` holds functions, so it cannot
  cross a JSON boundary - the schema rejects it, `check` cannot see it, and
  the copy `@pensketch/mcp` serves has it stripped. The seven points below are
  verified by eye. Everything else in this file is verified by `npm run
  diagrams`.

  Two things have to happen before this page shows anything:

    1. Build the packages. From the repository root:

         npm run build

       The page imports packages/core/dist/index.js, which is what the build
       produces.

    2. Serve the repository over HTTP. Also from the repository root:

         npx serve .              -> http://localhost:3000/examples/state-machine/
         python3 -m http.server   -> http://localhost:8000/examples/state-machine/

  Double-clicking the file will not work. A file:// document has the opaque
  origin "null", ES module scripts are fetched with CORS, and an opaque origin
  fails that check - the module never loads and the page stays blank.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pensketch - a state machine that branches</title>
<style>
/* Page chrome. The theming below this block is the documented snippet. */
:root { color-scheme: light dark; }
body { margin: 0; padding: 24px; }
svg { display: block; width: 100%; height: auto; margin-bottom: 24px; }
</style>
<style>
:root {
  --ps-ink: #232B36;
  --ps-pen: #2B5B8A;
  --ps-accent: #B3402E;
  --ps-muted: #5A6572;
  --ps-wash: rgba(43, 91, 138, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ps-ink: #D9DFE7;
    --ps-pen: #7FA9DB;
    --ps-accent: #DB8570;
    --ps-muted: #93A0AD;
    --ps-wash: rgba(127, 169, 219, .07);
  }
}
/* the hand-drawn feel depends on a handwriting font for labels */
svg text {
  font-family: "Chalkboard SE", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
}
</style>
</head>
<body>
<svg id="atm" viewBox="0 0 880 580" role="img" aria-label="An ATM as a state machine"></svg>
<script type="module">
import { draw } from '../../packages/core/dist/index.js'; // a bare specifier needs a bundler, and this page has none

draw(document.getElementById('atm'), {
  nodes: [
    // Pills for the two states the card can rest in, boxes for the work.
    { id: 'idle',   shape: 'pill',    x: 60,  y: 40,  w: 190, h: 52, lines: ['idle'] },
    { id: 'pin',    shape: 'box',     x: 60,  y: 170, w: 190, h: 52, lines: ['awaiting PIN'] },
    { id: 'verify', shape: 'diamond', x: 55,  y: 300, w: 200, h: 94, lines: ['PIN valid?'] },
    { id: 'menu',   shape: 'box',     x: 60,  y: 470, w: 190, h: 52, lines: ['select transaction'] },

    { id: 'eject',  shape: 'box',     x: 390, y: 170, w: 190, h: 52, lines: ['eject card'] },
    { id: 'cash',   shape: 'box',     x: 390, y: 470, w: 190, h: 52, lines: ['dispensing cash'] },

    { id: 'retain', shape: 'pill',    x: 650, y: 321, w: 180, h: 52, lines: ['card retained'] },
  ],
  edges: [
    { from: ['idle', 'b'],   to: ['pin', 't'],    label: 'card inserted', lx: 170, ly: 131, anchor: 'start' },
    { from: ['pin', 'b'],    to: ['verify', 't'], label: 'PIN entered',   lx: 170, ly: 261, anchor: 'start' },
    { from: ['verify', 'b'], to: ['menu', 't'],   label: 'valid',         lx: 170, ly: 432, anchor: 'start' },
    { from: ['verify', 'r'], to: ['retain', 'l'], label: '3 failures',    lx: 340, ly: 334, anchor: 'start' },

    // The retry, dotted so it reads as the exception. It leaves the diamond's
    // left side, runs up the margin and comes back into the box it came from -
    // three legs, all given. Nothing here is routed on your behalf.
    { from: ['verify', 'l'], to: ['pin', 'l'], via: [[25, 347], [25, 196]],
      dotted: true, label: 'invalid', lx: 40, ly: 271, anchor: 'start' },

    { from: ['menu', 'r'],  to: ['cash', 'l'],  label: 'withdraw',     lx: 292, ly: 483, anchor: 'start' },
    { from: ['cash', 't'],  to: ['eject', 'b'], label: 'cash taken',   lx: 500, ly: 290, anchor: 'start' },
    { from: ['eject', 't'], to: ['idle', 'r'],  label: 'card removed', lx: 326, ly: 53,  anchor: 'start',
      via: [[485, 66]] },
  ],
  raw: [
    // The self-transition the data model has no word for: another digit, stay
    // where you are.
    (p) => {
      // Seven points, not four. `stroke` jitters what it is handed and
      // interpolates nothing between, so too few points read as a beak
      // rather than an arc.
      p.arrow([
        [250, 184], [280, 172], [302, 180], [310, 196],
        [302, 212], [280, 220], [250, 208],
      ]);
      p.label(326, 196, ['digit', 'entered'], { size: 12.5, anchor: 'start' });
    },
  ],
});
</script>
</body>
</html>
