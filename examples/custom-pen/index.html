<!DOCTYPE html>
<!--
  pensketch - an order lifecycle, and the pen underneath it.

  The whole picture is data: states, transitions, the two terminal states that
  stop the machine, and the retry that stays where it is. That last one used
  to be the exception. An edge joined two *different* nodes, so "retry the
  payment, stay pending" could not be said at all, and this page drew it with
  a `raw` callback and a hand-placed label. It is an edge now, naming the same
  node and the same side at both ends, with `out` and `span` sizing the arc.

  What this folder is for is the second drawing. `pen()` hands you the drawing
  surface with no diagram in front of it - the same surface `draw` uses, and
  the same one a `raw` callback is handed mid-sequence - for the picture that
  is not a diagram at all.

  Two things have to happen before this page shows anything:

    1. Build the packages. From the repository root:

         npm run build

       The page imports packages/core/dist/index.js, which is what the build
       produces.

    2. Serve the repository over HTTP. Also from the repository root:

         npx serve .              -> http://localhost:3000/examples/custom-pen/
         python3 -m http.server   -> http://localhost:8000/examples/custom-pen/

  Double-clicking the file will not work. A file:// document has the opaque
  origin "null", ES module scripts are fetched with CORS, and an opaque origin
  fails that check - the module never loads and the page stays blank.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pensketch - an order lifecycle, and the pen underneath it</title>
<style>
/* Page chrome. The theming below this block is the documented snippet. */
:root { color-scheme: light dark; }
body { margin: 0; padding: 24px; }
svg { display: block; width: 100%; height: auto; margin-bottom: 24px; }
/* Both drawings are stretched to the page width, and this one's viewBox is
   only 500 across - left alone it renders nearly twice the scale of the
   diagram above and reads as the more important of the two. */
#primitives { max-width: 500px; }
</style>
<style>
:root {
  --ps-ink: #232B36;
  --ps-pen: #2B5B8A;
  --ps-accent: #B3402E;
  --ps-muted: #5A6572;
  --ps-wash: rgba(43, 91, 138, .05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ps-ink: #D9DFE7;
    --ps-pen: #7FA9DB;
    --ps-accent: #DB8570;
    --ps-muted: #93A0AD;
    --ps-wash: rgba(127, 169, 219, .07);
  }
}
/* the hand-drawn feel depends on a handwriting font for labels */
svg text {
  font-family: "Chalkboard SE", "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
}
</style>
</head>
<body>
<svg id="lifecycle" viewBox="0 0 900 290" role="img" aria-label="An order lifecycle state machine"></svg>
<script type="module">
import { draw } from '../../packages/core/dist/index.js'; // a bare specifier needs a bundler, and this page has none

draw(document.getElementById('lifecycle'), {
  nodes: [
    { id: 'placed',    shape: 'pill', x: 40,  y: 90,  w: 140, h: 50, lines: ['placed'] },
    { id: 'pending',   shape: 'pill', x: 250, y: 90,  w: 160, h: 50, lines: ['payment pending'], size: 12 },
    { id: 'paid',      shape: 'pill', x: 480, y: 90,  w: 130, h: 50, lines: ['paid'] },
    { id: 'shipped',   shape: 'pill', x: 680, y: 90,  w: 150, h: 50, lines: ['shipped'] },

    // Hatching marks the two states the machine never leaves.
    { id: 'delivered', shape: 'pill', x: 680, y: 200, w: 150, h: 50, lines: ['delivered'], hatch: true },
    { id: 'cancelled', shape: 'pill', x: 250, y: 200, w: 160, h: 50, lines: ['cancelled'], hatch: true },
  ],
  edges: [
    { from: ['placed', 'r'],  to: ['pending', 'l'] },

    // The self-transition: the same node and the same side, named twice. Its
    // whole path is those two plus `out` and `span`, which is why a `via` or a
    // `bow` on one is refused rather than combined. Both are set here rather
    // than left to the 30 and 40 defaults: this side is 160 px of pill and a
    // wider, shallower arch suits it, where the ATM's loop hangs off a 52 px
    // side and takes the defaults as they come.
    { from: ['pending', 't'], to: ['pending', 't'], out: 45, span: 80,
      label: 'retry x3', lx: 330, ly: 30 },

    { from: ['pending', 'r'], to: ['paid', 'l'],      label: 'authorised', lx: 445, ly: 100 },
    { from: ['paid', 'r'],    to: ['shipped', 'l'],   label: 'dispatched', lx: 645, ly: 100 },
    { from: ['shipped', 'b'], to: ['delivered', 't'], label: 'signed for', lx: 765, ly: 172, anchor: 'start' },

    // Dotted for the unhappy paths, which also recolors their labels.
    { from: ['pending', 'b'], to: ['cancelled', 't'], dotted: true, label: 'expired',  lx: 345, ly: 172, anchor: 'start' },
    { from: ['paid', 'b'],    to: ['cancelled', 'r'], dotted: true, label: 'refunded', lx: 478, ly: 210, anchor: 'end',
      via: [[545, 225]] },
  ],
}, { seed: 11 });
</script>

<!-- The same pen, reached the other way round: `pen()` hands it to you
     directly, with no diagram in front of it. -->
<svg id="primitives" viewBox="0 0 500 130" role="img" aria-label="The pen's primitives"></svg>
<script type="module">
import { pen } from '../../packages/core/dist/index.js';

const p = pen(document.getElementById('primitives'), { seed: 3 });
p.rect(20, 20, 200, 90);
p.label(120, 65, 'hand-drawn box');
p.arrow([[220, 65], [320, 65]]);
p.pill(320, 40, 150, 50);
p.label(395, 65, ['a pill', '(two lines)']);
</script>
</body>
</html>
