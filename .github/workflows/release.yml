name: Release

# Manual dispatch only: nothing that lands on a branch, a tag, or a merged
# pull request can reach the registry. Publishing is an owner action.
on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  # Commit the version bump, push the release branch, and push git tags.
  contents: write
  # Open and update the "Version Packages" pull request.
  pull-requests: write
  # Mint the OIDC token npm exchanges for a signed provenance attestation.
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          # Deliberately uncached: a release build should assemble what it
          # publishes from the registry, not from a restored directory.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or newer; older npm has no idea
      # what to do with the OIDC token and fails at the registry with a plain
      # authentication error, which reads like a misconfigured secret rather
      # than an out-of-date runner. Asserted rather than installed over: the
      # release job should not fetch an unpinned global npm.
      - name: The runner's npm can exchange an OIDC token
        run: |
          need=11.5.1
          have=$(npm -v)
          echo "npm $have, and trusted publishing needs >= $need"
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ]

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Both manifests ship only "dist", so publishing without this step
      # would upload a tarball with no code in it.
      - name: Build
        run: npm run build

      - name: Regenerate goldens
        run: npm run goldens

      - name: Regeneration leaves the tree unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Size budgets
        run: npm run size

      # "--no" makes npx resolve the changesets CLI from the lockfile-pinned
      # node_modules and fail rather than fetch a same-named package.
      - name: Version packages or publish to npm
        id: changesets
        # Pinned by commit, not by tag: this is the step that carries the
        # signing identity this workflow publishes under, and a tag can be
        # moved. The comment records which release the commit is.
        #
        # No NPM_TOKEN. The registry is configured to trust this repository
        # and this workflow file, so npm exchanges the OIDC token minted by
        # `id-token: write` for a short-lived credential of its own. At this
        # pin the action says which path it took: "No NPM_TOKEN found, but
        # OIDC is available - using npm trusted publishing". If it instead
        # logs "assuming npm is already authenticated", the permission block
        # above is not reaching it and the publish will fail unauthenticated.
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npx --no changeset publish
        env:
          # Read by the npm publish that the changesets CLI shells out to.
          NPM_CONFIG_PROVENANCE: 'true'

      # The step above exits zero even when it does nothing — which is what a
      # bump of that pin looks like, since the action renames every input and
      # output in its next major and Actions only warns about an input it does
      # not declare. A release that released nothing should be red.
      - name: The dispatch released something
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PULL_REQUEST: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          if [ "$PUBLISHED" = 'true' ]; then
            echo "Published."
          elif [[ "$PULL_REQUEST" =~ ^[0-9]+$ ]]; then
            echo "Opened or updated version pull request #${PULL_REQUEST}."
          else
            echo "::error::This dispatch neither published nor opened a version pull request."
            echo "Either there was genuinely nothing to release, or the release step is no"
            echo "longer reading the inputs it is handed. If the pinned action version"
            echo "changed, check every input and output name here against its action.yml at"
            echo "that ref before assuming the former."
            exit 1
          fi
