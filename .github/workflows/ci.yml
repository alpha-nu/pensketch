name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A second push supersedes the first: there is nothing to learn from finishing
# a run against a commit that is already history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, one install. The whole chain takes about ten seconds to run; what
  # costs real time is `npm ci` and provisioning a runner, so paying for those
  # once beats spreading the work over jobs that each pay again.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheapest first, so an obvious failure does not wait on a build.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Vitest titles every job-summary block "Vitest Test Report", and this
      # job produces three of them. The reporter has no title option, but the
      # summary is only markdown appended to a file, so each run announces
      # itself first - at `#`, one level above the `##` vitest writes.
      - name: Test
        run: |
          {
            echo "# Full suite"
            echo "**Node** $(node -v) · **React** $(node -p 'require("react/package.json").version') · every project, coverage thresholds enforced."
          } >> "$GITHUB_STEP_SUMMARY"
          npm test

      - name: Build
        run: npm run build

      # Budgets are a published contract, so the numbers belong in the summary
      # rather than only in a log. The status is carried across the write so a
      # breach still fails the step.
      - name: Size budgets
        run: |
          out=$(npm run size --silent) && rc=0 || rc=$?
          {
            echo "# Size budgets"
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # Two generated artefacts, one assertion. The goldens step is not a
      # second opinion on the parity tests: those compare the port against the
      # goldens, this compares reference/renderer.html against them. Without
      # it the goldens are only pinned to the port, and a parity failure can be
      # made to pass by regenerating the thing it measures. The schema is
      # derived from the types, so this is what stops the two drifting.
      - name: Generated files still match their sources
        run: |
          npm run goldens
          npm run schema
          git status --porcelain
          test -z "$(git status --porcelain)"

      # The manifests say `engines: ">=22"`. Only the suite is repeated -
      # Biome, tsc and esbuild are the same binaries whichever Node invokes
      # them, and node_modules is already installed, so this costs one Node
      # download rather than another job.
      # No `cache:` here or below - node_modules is already installed, and a
      # second cache registration only races the first on the post-job save.
      - name: Set up the supported Node floor
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test on the Node floor
        run: |
          {
            echo "# Node floor"
            echo "**Node** $(node -v) · the oldest runtime the manifests admit · the same suite again, so the published floor is a tested claim."
          } >> "$GITHUB_STEP_SUMMARY"
          npm test

      # Last, because it is the only step that mutates node_modules. The peer
      # range admits React 18, and shipping that claim untested is how
      # useSketch once returned a ref type that 18 could not accept.
      - name: Restore Node and install the older React major
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install React 18
        run: npm install --no-save react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18

      - name: Typecheck against React 18
        run: npm run typecheck

      - name: Test the bindings against React 18
        run: |
          {
            echo "# React 18 bindings"
            echo "**React** $(node -p 'require("react/package.json").version') · the older half of the ^18 || ^19 peer range · bindings only, since core does not touch React."
          } >> "$GITHUB_STEP_SUMMARY"
          npx vitest run --project react
