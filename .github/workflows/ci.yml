name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Regenerate goldens
        run: npm run goldens

      # Regeneration above must leave the tree exactly as it was. A diff
      # limited to tracked files under one directory would miss a generator
      # that emits a brand new golden, and would silently pass forever if the
      # path were ever mistyped, so the whole working tree is asserted clean.
      - name: Regeneration leaves the tree unchanged
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

      - name: Size budgets
        run: npm run size

  # The peer range admits React 18, so something has to compile against it.
  # The job installs the older major over the top of the workspace install and
  # runs the type gate and the React suite; the rest of the chain is
  # version-independent and already covered above.
  react18:
    name: Verify against React 18
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the older React major
        run: npm install --no-save react@^18 react-dom@^18 @types/react@^18 @types/react-dom@^18

      - name: Typecheck
        run: npm run typecheck

      - name: Test the bindings
        run: npx vitest run --project react
