name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Regenerate goldens
        run: npm run goldens

      # Regeneration above must be a no-op. A non-empty diff means the
      # reference renderer, the generator, and the committed goldens have
      # drifted apart, which must never merge unnoticed.
      - name: Goldens are unchanged by regeneration
        run: git diff --exit-code -- packages/core/test/goldens

      - name: Size budgets
        run: npm run size
